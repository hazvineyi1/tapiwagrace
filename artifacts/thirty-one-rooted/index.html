<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- The static host gives us no way to set response headers, so the policy
         rides in the document. Everything the site needs is same-origin: the
         bundle, the stylesheet, the self-hosted fonts, the films, and the API
         under /api. data: is only for the few inlined images Vite emits.
         frame-ancestors and Strict-Transport-Security are ignored in a meta
         tag and still need to be set on the host. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      media-src 'self';
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self'
    " />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>31&amp;Rooted | A Space for Becoming</title>
    <meta name="description" content="A quiet, faith-rooted space for women navigating real life, retreats, reflections, and deeper conversations." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta property="og:site_name" content="31&amp;Rooted" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="31&amp;Rooted | A Space for Becoming" />
    <meta property="og:description" content="A quiet, faith-rooted space for women navigating real life, retreats, reflections, and deeper conversations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="31 &amp; Rooted — Come back to yourself. Come closer to Christ." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="31&amp;Rooted | A Space for Becoming" />
    <meta name="twitter:description" content="A quiet, faith-rooted space for women navigating real life, retreats, reflections, and deeper conversations." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.jpg" />
    <meta name="twitter:image:alt" content="31 &amp; Rooted — Come back to yourself. Come closer to Christ." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The two faces that paint first: the display serif and the UI sans.
         Both are same-origin, so crossorigin is still required for fonts. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/cormorant-garamond-300-normal-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/dm-sans-100-1000-normal-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
