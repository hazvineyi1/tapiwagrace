openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Bookings, contact messages and newsletter sign-ups
  - name: reflection
    description: The guided reflection companion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bookings:
    post:
      operationId: createBooking
      tags: [enquiries]
      summary: Request a retreat, conversation or meal package
      description: >
        Records an enquiry from the booking flow. Every kind of enquiry is
        recorded as new and followed up by hand; nothing is auto-confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "201":
          description: Enquiry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
  /newsletter:
    post:
      operationId: subscribeToNewsletter
      tags: [enquiries]
      summary: Join the mailing list
      description: >
        Adds an email address to the list. Subscribing an address that is
        already on the list succeeds and reports alreadySubscribed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterRequest"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
  /reflection:
    post:
      operationId: createReflection
      tags: [reflection]
      summary: Continue a guided reflection
      description: >
        Returns the companion's next message for a guided reflection. Send the
        conversation so far; send an empty list to open a new one. Nothing is
        stored. Returns 503 when the companion is not configured, so the client
        can fall back to the offline frameworks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionRequest"
      responses:
        "200":
          description: The companion's next message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          description: Too many reflections from this visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "503":
          description: The companion is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
  /contact:
    post:
      operationId: sendContactMessage
      tags: [enquiries]
      summary: Send a message from the contact page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BookingKind:
      type: string
      enum: [retreat, conversation, meal]
    BookingRequest:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/BookingKind"
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 200
        preferredDate:
          description: Preferred date as YYYY-MM-DD. Omitted when the visitor has no date in mind.
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        preferredTime:
          type: string
          maxLength: 40
        message:
          type: string
          maxLength: 2000
      required:
        - kind
        - name
        - email
    BookingCreated:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/BookingKind"
        status:
          type: string
      required:
        - id
        - kind
        - status
    NewsletterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 200
      required:
        - email
    NewsletterResult:
      type: object
      properties:
        id:
          type: integer
        alreadySubscribed:
          type: boolean
      required:
        - id
        - alreadySubscribed
    ContactRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 200
        subject:
          type: string
          maxLength: 160
        message:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - name
        - email
        - message
    ContactCreated:
      type: object
      properties:
        id:
          type: integer
      required:
        - id
    ReflectionTurn:
      type: object
      properties:
        role:
          type: string
          enum: [guide, seeker]
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - role
        - text
    ReflectionRequest:
      type: object
      properties:
        framework:
          type: string
          enum: [reframing, breakthrough, calling, open]
        turns:
          description: The conversation so far, oldest first. Empty opens a new reflection.
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/ReflectionTurn"
      required:
        - framework
        - turns
    ReflectionScripture:
      type: object
      properties:
        reference:
          type: string
        text:
          type: string
      required:
        - reference
        - text
    ReflectionVoice:
      description: A named human-wisdom perspective, paraphrased rather than quoted.
      type: object
      properties:
        thinker:
          type: string
        insight:
          type: string
      required:
        - thinker
        - insight
    ReflectionReply:
      type: object
      properties:
        reply:
          type: string
        scripture:
          $ref: "#/components/schemas/ReflectionScripture"
        voice:
          $ref: "#/components/schemas/ReflectionVoice"
        invitation:
          type: string
        closing:
          type: boolean
        care:
          description: True when the visitor should be pointed toward real human support.
          type: boolean
      required:
        - reply
        - closing
        - care
    ValidationProblem:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
      required:
        - error
